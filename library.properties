sentence=Unified library to read pulse dialing from telephone rotary dials — mechanical and optical encoder.
paragraph=Supports both traditional metallic-contact rotary dials and optical encoder disks (10-slot + rest area). Single #include <RotaryDialUnified.h>. Select mode via begin(pin, ROTARYDIAL_UNIFIED_MECHANICAL) or begin(pin, ROTARYDIAL_UNIFIED_OPTICAL). Default pin D0 (RP2040/ESP32). AVR: use pin 2. ESP32 ISR uses IRAM_ATTR automatically.
